<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="theme-color" content="#121110" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Alya Bazen Duygularını Rusça Saklar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="progress"><span id="progressBar"></span></div>

  <header class="bar">
    <select id="volSelect" class="select vol-select" aria-label="Cilt seçimi">
      <option value="4">Cilt 4</option>
      <option value="4.5">Cilt 4.5</option>
      <option value="5">Cilt 5</option>
      <option value="6">Cilt 6</option>
      <option value="7">Cilt 7</option>
      <option value="8">Cilt 8</option>
      <option value="9">Cilt 9</option>
      <option value="9.5">Cilt 9.5</option>
      <option value="10">Cilt 10</option>
      <option value="11">Cilt 11</option>
      <option value="12">Cilt 12</option>
    </select>

    <button class="pick pick-ch" id="chBtn" type="button" aria-haspopup="dialog" aria-expanded="false">
      <span id="chLabel">Bölüm 1</span><i class="chev" aria-hidden="true"></i>
    </button>

    <div class="seg seg-mode" role="group" aria-label="Görünüm">
      <button id="modeText" class="seg-btn is-on" type="button">Çeviri</button>
      <button id="modePage" class="seg-btn" type="button">Orijinal</button>
    </div>

    <button class="icon" id="themeBtn" type="button" title="Tema (t)" aria-label="Tema değiştir">☾</button>
  </header>

  <main id="main">
    <section class="lib" id="libView" hidden aria-label="Cilt ve bölüm listesi">
      <div class="lib-head">
        <button class="lib-back" id="libBack" type="button">‹ Ciltler</button>
        <h2 class="lib-title" id="libTitle">Ciltler</h2>
        <button class="mini lib-close" id="libClose" type="button" aria-label="Listeyi kapat">Kapat</button>
      </div>
      <div class="lib-actions" id="libActions" hidden>
        <button class="mini" id="markAllBtn" type="button">Hepsini okundu say</button>
        <button class="mini" id="clearAllBtn" type="button">İşaretleri temizle</button>
      </div>
      <div class="lib-list" id="libList"></div>
    </section>

    <article id="reader" class="reader" aria-live="polite"></article>
  </main>

  <footer class="nav">
    <button class="nav-btn" id="prevBtn" type="button" title="Önceki (←)">‹</button>
    <div class="nav-mid">
      <div class="nav-ch">
        <span class="nav-ch-name" id="navChapter">Bölüm 1</span>
        <span class="nav-ch-pages" id="navPages">s. 1–8</span>
      </div>
      <input id="pageRange" type="range" min="1" max="13" value="1" aria-label="Bölüm" />
    </div>
    <button class="nav-btn" id="nextBtn" type="button" title="Sonraki (→)">›</button>
  </footer>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Sayfa görseli">
    <button class="lb-close" type="button" aria-label="Kapat">✕</button>
    <img alt="" />
  </div>

  <!-- eski arayüz uyumluluğu (gizli) -->
  <div class="legacy" hidden>
    <button id="volBtn" type="button" aria-haspopup="dialog" aria-expanded="false">
      <span id="volLabel">Cilt 4</span>
    </button>
    <ul id="tocList"></ul>
    <span id="tocLabel"></span>
    <span id="navCount"></span>
    <span id="chPct"></span>
    <a id="homeBtn" href="#"></a>
    <span id="brandSub"></span>
    <button id="modeBtn" type="button"></button>
    <button id="fontUp" type="button"></button>
    <button id="fontDown" type="button"></button>
    <div id="volMenu"></div>
    <div id="tocPanel"></div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
