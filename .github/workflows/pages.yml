name: Deploy Static Reader to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build & Verify Static Reader
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run QC verification suite
        run: npm test

      - name: Build static reader bundle and volume JSON files
        run: node scripts/build_bundle.js

      - name: Verify static Pages output
        run: |
          test -f public/index.html
          test -f public/.nojekyll
          test -f public/books/index.json
          test -f public/books/4.json
          test -f public/books/4.5.json
          test -f public/books/5.json
          test -f public/books/6.json
          test -f public/pages/004.webp
          test -f public/pages45/004.webp
          test -f public/pages5/001.webp
          test -f public/pages6/001.webp

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
