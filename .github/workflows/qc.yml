name: Çeviri kalite kapısı

on:
  push:
    paths:
      - 'data/**'
      - 'data45/**'
      - 'data*/**'
      - 'mt/**'
      - 'scripts/qc/**'
      - 'scripts/naturalize.js'
      - 'scripts/norm_typo.js'
      - 'scripts/fix_boundaries.js'
      - '.github/workflows/qc.yml'
  pull_request:
  workflow_dispatch:

jobs:
  qc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vol: ['4', '4.5']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Doğrulama (verify.js)
        env:
          ALYA_TR_FILE: ${{ matrix.vol == '4' && 'data/paragraphs_final.json' || 'data45/paragraphs_final.json' }}
        run: node scripts/qc/verify.js
      - name: Kalite puanı (quality.js)
        run: node scripts/qc/quality.js ${{ matrix.vol == '4' && 'data/paragraphs_final.json' || 'data45/paragraphs_final.json' }}
      - name: Eşik kapısı (cli.js)
        run: node scripts/qc/cli.js --volume ${{ matrix.vol }} --strict
