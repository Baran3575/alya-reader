name: QC CLI Matrix Gating

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'data*/**'
      - 'scripts/**'
      - 'test/**'
      - 'server.js'
      - '.github/workflows/**'
      - 'package.json'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  discover-volumes:
    name: Discover Enabled Volumes
    runs-on: ubuntu-latest
    outputs:
      volumes: ${{ steps.manifest.outputs.volumes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read enabled volume IDs from data/volumes.json
        id: manifest
        run: |
          VOLS=$(node -e "const v = require('./data/volumes.json'); console.log(JSON.stringify(v.filter(x => x.enabled).map(x => x.id)));")
          echo "volumes=${VOLS}" >> "$GITHUB_OUTPUT"

  qc-matrix:
    name: QC Matrix (Cilt ${{ matrix.volume }})
    needs: discover-volumes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        volume: ${{ fromJSON(needs.discover-volumes.outputs.volumes) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve volume source path
        id: vol
        env:
          MATRIX_VOL: ${{ matrix.volume }}
        run: |
          SRC_FILE=$(node -e 'const v = require("./data/volumes.json").find(x => String(x.id) === String(process.env.MATRIX_VOL)); console.log(v.dataDir + "/source.json");')
          echo "source_file=${SRC_FILE}" >> "$GITHUB_OUTPUT"

      - name: Ensure source file remains read-only
        run: |
          chmod 444 "${{ steps.vol.outputs.source_file }}"

      - name: Dry-run patch regression test (Cilt ${{ matrix.volume }})
        run: node scripts/patch.js --volume "${{ matrix.volume }}" --dry-run

      - name: Run Unified QC CLI (${{ matrix.volume }})
        run: node scripts/qc/cli.js --volume "${{ matrix.volume }}" --strict --check-regression

      - name: Verify source file was untouched
        run: |
          git diff --exit-code "${{ steps.vol.outputs.source_file }}"
