name: QC CLI Matrix Gating

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'data*/**'
      - 'public/**'
      - 'scripts/**'
      - 'server.js'
      - 'test/**'
      - '.github/workflows/**'
      - 'package.json'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  qc-matrix:
    name: QC Matrix (Cilt ${{ matrix.volume }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        volume: ['4', '4.5', '5', '6', '7', '8', '9', '9.5', '10', '11', '12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure canonical source files remain read-only
        run: |
          chmod 444 data*/source.json

      - name: Dry-run patch regression test (Volume 4)
        if: matrix.volume == '4'
        run: node scripts/patch.js --dry-run

      - name: Verify lazy volume chunks, static Pages build, and Service Worker cache (Volume 4)
        if: matrix.volume == '4'
        run: |
          node test/bundle-lazy-cache.test.js
          npm run build:site

      - name: Run Unified QC CLI (${{ matrix.volume }})
        run: node scripts/qc/cli.js --volume ${{ matrix.volume }} --strict --check-regression

      - name: Verify canonical source files were untouched
        run: |
          git diff --exit-code data*/source.json
