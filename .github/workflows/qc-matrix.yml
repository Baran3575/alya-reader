name: QC CLI Matrix Gating

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'volumes.json'
      - 'data*/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'package.json'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  discover:
    name: Discover Active Volumes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      volumes: ${{ steps.vols.outputs.volumes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compute active volume matrix
        id: vols
        run: |
          echo "volumes=$(node scripts/volumes.js --active-ids)" >> "$GITHUB_OUTPUT"

  qc-matrix:
    name: QC Matrix (Cilt ${{ matrix.volume }})
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        volume: ${{ fromJSON(needs.discover.outputs.volumes) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure source files remain read-only
        run: |
          node scripts/volumes.js --source-files | xargs chmod 444

      - name: Dry-run patch regression test (Volume ${{ matrix.volume }})
        run: node scripts/patch.js --dry-run --volume "${{ matrix.volume }}"

      - name: Run Unified QC CLI (${{ matrix.volume }})
        run: node scripts/qc/cli.js --volume "${{ matrix.volume }}" --strict --check-regression

      - name: Verify source files were untouched
        run: |
          node scripts/volumes.js --source-files | xargs git diff --exit-code --
