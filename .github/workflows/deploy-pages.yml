name: Deploy Reader to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Lazy Chunks & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Protect active source.json files
        run: |
          node scripts/volumes.js --source-files | xargs chmod 444

      - name: Build volume JSON chunks and manifest
        run: npm run build

      - name: Run QC and verification suite
        run: npm test

      - name: Verify source.json files were untouched
        run: |
          node scripts/volumes.js --source-files | xargs git diff --exit-code --

      - name: Stage clean public/ directory
        run: |
          rm -rf /tmp/pages-public
          cp -R ./public /tmp/pages-public
          rm -f /tmp/pages-public/*.bak

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload public/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '/tmp/pages-public'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
