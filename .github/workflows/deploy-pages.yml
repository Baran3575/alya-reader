name: Deploy Reader to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build & Verify Static Reader (Vols 4–12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Run patch dry-run and QC test suite across all volumes
        run: |
          node scripts/patch.js --dry-run
          npm test

      - name: Build & verify staged Pages artifact
        run: |
          npm run build:site
          rm -rf dist/pages dist/pages45
          find dist -type f -name '*.bak' -delete
          test -f dist/.nojekyll
          test -f dist/index.html
          test -f dist/style.css
          test -f dist/app.js
          test -f dist/bundle.js
          test -f dist/bundle-art.js
          test -f dist/sw.js
          if find dist -name '*.bak' | grep -q .; then
            echo "Backup (.bak) files found in staged Pages artifact" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
